<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jot it. Forget it. — ephemeral notes for Windows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#CFD3C9;      /* revealed beneath the paper */
    --paper:#FBFAF4;
    --ink:#191B17;
    --muted:#6E7369;
    --accent:#4038B5;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--void);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0
  }

  .hero{position:relative;height:100svh;min-height:520px;overflow:hidden}
  #gl{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    opacity:0;transition:opacity .5s ease
  }
  #gl.ready{opacity:1}

  /* CSS-only fallback if WebGL is unavailable */
  .fallback{position:absolute;inset:0;background:var(--paper);display:none;padding:7vw}
  .fallback h2{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
    font-size:clamp(38px,8.5vw,120px);line-height:.9;letter-spacing:-.04em;margin:0
  }
  .fallback em{font-style:normal;color:var(--accent)}
  .fallback p{max-width:34ch;margin:18px 0 0;color:var(--muted);font-size:15px}
  html.nogl .fallback{display:block}
  html.nogl #gl,html.nogl .hint{display:none}

  /* DOM layer — stays crisp and clickable above the dissolving paper */
  .ui{position:absolute;inset:0;padding:clamp(22px,4.4vw,52px);
    display:flex;flex-direction:column;justify-content:space-between;
    pointer-events:none;z-index:2}
  .brand{display:flex;align-items:center;gap:10px;font-family:"IBM Plex Mono",monospace;
    font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
  .brand b{width:7px;height:7px;border-radius:2px;background:var(--accent);display:block}

  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
  .cta{display:flex;gap:9px;pointer-events:auto}
  .cta a{
    font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;
    text-decoration:none;padding:13px 19px;border-radius:3px;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    transition:background .15s,border-color .15s,color .15s
  }
  .cta a.ghost{background:rgba(251,250,244,.55);color:var(--ink);border-color:rgba(25,27,23,.28);
    backdrop-filter:blur(6px)}
  .cta a:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .cta a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;line-height:1.7;
    letter-spacing:.05em;color:var(--muted);text-align:right}

  .hint{
    position:absolute;left:50%;bottom:clamp(90px,13vh,150px);transform:translateX(-50%);
    font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);z-index:2;pointer-events:none;
    transition:opacity .6s ease
  }
  .hint.gone{opacity:0}

  @media (max-width:640px){
    .meta{text-align:left}
    .bottom{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<section class="hero">
  <h1 class="sr-only">Jot it. Forget it. — 저장되지 않는 메모, Windows 데스크톱 앱</h1>

  <canvas id="gl" aria-hidden="true"></canvas>

  <div class="fallback" aria-hidden="true">
    <h2>Jot it.<br><em>Forget it.</em></h2>
    <p>적는 순간에만 존재하는 메모. 창을 닫으면 남지 않습니다.</p>
  </div>

  <div class="ui">
    <div class="brand"><b></b> Ephemeral notes for Windows</div>
    <div class="bottom">
      <div class="cta">
        <a href="#download">Download</a>
        <a href="#how" class="ghost">어떻게 동작하나</a>
      </div>
      <p class="meta">
        저장 버튼 없음 · 동기화 없음 · 계정 없음<br>
        Windows 10/11 · 4.2 MB
      </p>
    </div>
  </div>

  <p class="hint" id="hint">커서를 움직여 보세요</p>
</section>

<script>
(function(){
"use strict";

const cvs  = document.getElementById("gl");
const gl = cvs.getContext("webgl", {
  alpha:true, antialias:false, premultipliedAlpha:false,
  depth:false, stencil:false, powerPreference:"low-power"
});
if(!gl){ document.documentElement.classList.add("nogl"); return; }

const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------------------------------------------------------
   paper face — baked once per resize, kept out of the shader
--------------------------------------------------------------- */
const face = document.createElement("canvas");
const fx   = face.getContext("2d");

function bake(w, h, dpr){
  face.width  = Math.max(2, Math.round(w * dpr));
  face.height = Math.max(2, Math.round(h * dpr));
  fx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fx.clearRect(0, 0, w, h);

  fx.fillStyle = "#FBFAF4";
  fx.fillRect(0, 0, w, h);

  // ruling
  const gap = Math.max(34, h * 0.062);
  fx.strokeStyle = "rgba(64,56,181,.10)";
  fx.lineWidth = 1;
  for(let y = gap * 1.5; y < h; y += gap){
    fx.beginPath(); fx.moveTo(0, y + .5); fx.lineTo(w, y + .5); fx.stroke();
  }

  const pad = Math.max(24, Math.min(w * 0.072, 92));
  fx.strokeStyle = "rgba(190,74,60,.22)";
  fx.beginPath(); fx.moveTo(pad * 0.62, 0); fx.lineTo(pad * 0.62, h); fx.stroke();

  // headline — mirrored by the sr-only h1 for assistive tech and crawlers
  const size = Math.max(34, Math.min(w * 0.086, h * 0.20, 124));
  fx.font = `800 ${size}px "Bricolage Grotesque", system-ui, sans-serif`;
  fx.textBaseline = "alphabetic";
  const top = h * 0.5 - size * 0.62;

  fx.fillStyle = "#191B17";
  fx.fillText("Jot it.", pad, top);
  fx.fillStyle = "#4038B5";
  fx.fillText("Forget it.", pad, top + size * 0.92);

  fx.fillStyle = "#6E7369";
  fx.font = `400 ${Math.max(13, size * 0.155)}px "IBM Plex Sans", system-ui, sans-serif`;
  fx.fillText("적는 순간에만 존재하는 메모. 창을 닫으면 남지 않습니다.", pad + 3, top + size * 1.55);
}

/* ---------------------------------------------------------------
   gl helpers
--------------------------------------------------------------- */
function sh(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function uni(p, names){
  const o = {}; for(const n of names) o[n] = gl.getUniformLocation(p, n); return o;
}

const VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

/* --- pass 1: the trail. one channel, half resolution, decays every frame --- */
const TRAIL_FS = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uPrev;
uniform vec2 uA, uB, uAspect;
uniform float uRadius, uFade;

float segDist(vec2 p, vec2 a, vec2 b){
  vec2 pa = p - a, ba = b - a;
  float t = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0.0, 1.0);
  return length(pa - ba * t);
}

void main(){
  float prev = texture2D(uPrev, vUv).r * uFade;
  // distance to the segment the cursor swept this frame, so fast motion leaves no gaps
  float d = segDist(vUv * uAspect, uA * uAspect, uB * uAspect);
  float add = uRadius > 0.0 ? 1.0 - smoothstep(uRadius * 0.30, uRadius, d) : 0.0;
  gl_FragColor = vec4(max(prev, add), 0.0, 0.0, 1.0);
}`;

/* --- pass 2: paper, dissolved wherever the trail says so --- */
const SCENE_FS = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uFace, uTrail;
uniform vec2 uAspect;
uniform float uTime, uScale, uEdge;
uniform vec3 uEdgeA, uEdgeB;

vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(
      i.z+vec4(0.0,i1.z,i2.z,1.0))
    + i.y+vec4(0.0,i1.y,i2.y,1.0))
    + i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}

// cheap fibre grain — a full simplex tap per pixel is too costly full-bleed
float grain(vec2 p){
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
}

void main(){
  vec3 col = texture2D(uFace, vUv).rgb;
  col *= 0.988 + 0.024 * grain(gl_FragCoord.xy);

  float T = texture2D(uTrail, vUv).r;
  if (T < 0.002) { gl_FragColor = vec4(col, 1.0); return; }

  float nz = snoise(vec3(vUv * uAspect * uScale, uTime * 0.06));
  float th = mix(-1.18, 1.18, T);
  if (nz < th) discard;

  float edge = 1.0 - smoothstep(th, th + uEdge, nz);
  edge *= smoothstep(0.0, 0.10, T);
  col = mix(col, uEdgeA, pow(edge, 0.9));
  col += uEdgeB * pow(edge, 4.0) * 0.55;

  gl_FragColor = vec4(col, 1.0);
}`;

const trailP = prog(VS, TRAIL_FS);
const sceneP = prog(VS, SCENE_FS);
const tU = uni(trailP, ["uPrev","uA","uB","uAspect","uRadius","uFade"]);
const sU = uni(sceneP, ["uFace","uTrail","uAspect","uTime","uScale","uEdge","uEdgeA","uEdgeB"]);

// full-screen triangle
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
for(const p of [trailP, sceneP]){
  const loc = gl.getAttribLocation(p, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}

/* ---------------------------------------------------------------
   textures & ping-pong targets
--------------------------------------------------------------- */
function mkTex(w, h, data){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if(data) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, data);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}

const faceTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, faceTex);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

let fbo = [null,null], rt = [null,null], read = 0;

let W = 0, H = 0, TW = 0, TH = 0, aspect = [1,1];

function resize(){
  const r = cvs.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1, matchMedia("(pointer:coarse)").matches ? 1.5 : 2);
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if(w === W && h === H) return;
  W = w; H = h; cvs.width = W; cvs.height = H;

  aspect = r.width >= r.height ? [r.width / r.height, 1] : [1, r.height / r.width];

  bake(r.width, r.height, dpr);
  gl.bindTexture(gl.TEXTURE_2D, faceTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, face);

  // trail runs at half resolution — it is a soft mask, nobody can see the difference
  TW = Math.max(2, W >> 1); TH = Math.max(2, H >> 1);
  for(let i=0;i<2;i++){
    if(rt[i]) gl.deleteTexture(rt[i]);
    if(fbo[i]) gl.deleteFramebuffer(fbo[i]);
    rt[i] = mkTex(TW, TH, null);
    fbo[i] = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[i]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, rt[i], 0);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

/* ---------------------------------------------------------------
   pointer
--------------------------------------------------------------- */
const hero = cvs.parentElement;
const hint = document.getElementById("hint");
if(matchMedia("(pointer:coarse)").matches) hint.textContent = "화면을 문질러 보세요";
let px = 0.5, py = 0.5, qx = 0.5, qy = 0.5;
let active = false, lastMove = -1e9, moved = false;

hero.addEventListener("pointermove", e => {
  const r = hero.getBoundingClientRect();
  qx = (e.clientX - r.left) / r.width;
  qy = 1 - (e.clientY - r.top) / r.height;
  active = true; lastMove = performance.now();
  if(!moved){ moved = true; hint.classList.add("gone"); }
}, {passive:true});

hero.addEventListener("pointerleave", () => { active = false; });
hero.addEventListener("pointerdown", e => {
  const r = hero.getBoundingClientRect();
  qx = (e.clientX - r.left) / r.width;
  qy = 1 - (e.clientY - r.top) / r.height;
  active = true; lastMove = performance.now();
}, {passive:true});

/* ---------------------------------------------------------------
   frame
--------------------------------------------------------------- */
const RADIUS = 0.14, FADE = 0.978;
const EDGE_A = [0.251, 0.220, 0.710];   // #4038B5
const EDGE_B = [0.557, 0.525, 0.961];   // #8E86F5

let t = 0, last = performance.now(), running = true, first = true;

function frame(now){
  if(!running) return;
  requestAnimationFrame(frame);
  const dt = Math.min((now - last)/1000, 0.05); last = now;
  t += dt;
  resize();

  // idle: drift a point around so the effect is discoverable without a cursor
  const idle = !reduce && (now - lastMove > 3500);
  if(idle){
    qx = 0.5 + Math.sin(t * 0.31) * 0.30 + Math.sin(t * 0.13) * 0.09;
    qy = 0.5 + Math.cos(t * 0.24) * 0.22;
    active = true;
  }

  const ax = px, ay = py;
  px += (qx - px) * (idle ? 0.10 : 0.34);
  py += (qy - py) * (idle ? 0.10 : 0.34);

  // pass 1 — trail
  const write = 1 - read;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[write]);
  gl.viewport(0, 0, TW, TH);
  gl.useProgram(trailP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, rt[read]);
  gl.uniform1i(tU.uPrev, 0);
  gl.uniform2f(tU.uA, ax, ay);
  gl.uniform2f(tU.uB, px, py);
  gl.uniform2f(tU.uAspect, aspect[0], aspect[1]);
  gl.uniform1f(tU.uRadius, active ? RADIUS : 0);
  gl.uniform1f(tU.uFade, Math.pow(FADE, dt * 60));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  read = write;

  // pass 2 — paper
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  // discard leaves holes; never trust the implicit clear to have happened
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(sceneP);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, faceTex);
  gl.uniform1i(sU.uFace, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, rt[read]);
  gl.uniform1i(sU.uTrail, 1);
  gl.uniform2f(sU.uAspect, aspect[0], aspect[1]);
  gl.uniform1f(sU.uTime, reduce ? 0 : t);
  gl.uniform1f(sU.uScale, 9.0);
  gl.uniform1f(sU.uEdge, 0.11);
  gl.uniform3fv(sU.uEdgeA, EDGE_A);
  gl.uniform3fv(sU.uEdgeB, EDGE_B);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  if(first){ first = false; cvs.classList.add("ready"); }
}

resize();
requestAnimationFrame(frame);

/* ---------------------------------------------------------------
   stop paying for frames nobody sees
--------------------------------------------------------------- */
function setRunning(on){
  if(on === running) return;
  running = on;
  if(on){ last = performance.now(); requestAnimationFrame(frame); }
}
new IntersectionObserver(
  ([e]) => setRunning(e.isIntersecting && !document.hidden),
  {threshold: 0}
).observe(hero);
document.addEventListener("visibilitychange", () => setRunning(!document.hidden));

cvs.addEventListener("webglcontextlost", e => { e.preventDefault(); running = false; });

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => { W = 0; resize(); });   // force a re-bake with real fonts
}
})();
</script>
</body>
</html>
