const KO={기쁨:'happy joy smile grin laugh',행복:'happy joy smile heart',웃음:'laugh smile joy',사랑:'love heart kiss couple',하트:'heart love',슬픔:'sad cry tear disappointed',눈물:'cry tear sad',화남:'angry mad rage',분노:'angry rage',놀람:'surprise shocked wow',축하:'party celebrate congratulations confetti birthday',생일:'birthday cake party',감사:'thanks thank pray bow',미안:'sorry bow sad',응원:'cheer clap muscle fighting',박수:'clap applause',손:'hand finger gesture',사람:'person people human',가족:'family parent child',동물:'animal pet',고양이:'cat kitten',강아지:'dog puppy',개:'dog puppy',음식:'food meal eat',과일:'fruit',커피:'coffee hot beverage',술:'beer wine alcohol drink',여행:'travel airplane luggage map',자동차:'car vehicle',비행기:'airplane flight travel',날씨:'weather sun cloud rain snow',불:'fire flame hot',물:'water wave droplet',꽃:'flower blossom',별:'star sparkle',달:'moon night',태양:'sun sunny',음악:'music musical note',운동:'sport exercise ball',일:'work office briefcase',돈:'money cash dollar',시간:'time clock watch',전화:'phone telephone mobile',컴퓨터:'computer laptop keyboard',책:'book read study',학교:'school student teacher',집:'house home',병원:'hospital doctor health',경고:'warning alert danger',확인:'check okay yes done',실패:'fail no cross error',국기:'flag country',한국:'korea korean flag',귀여운:'cute cat heart',최고:'best thumbs up fire',좋아요:'like thumbs up heart',싫어요:'dislike thumbs down',잠:'sleep sleepy bed',아픔:'sick hurt pain',선물:'gift present',크리스마스:'christmas santa tree',할로윈:'halloween ghost pumpkin'};
const GN=['얼굴과 감정','사람과 신체','구성 요소','동물과 자연','음식과 음료','여행과 장소','활동','사물','기호','깃발'];
const norm=s=>s.toLowerCase().normalize('NFKD').replace(/[^a-z0-9가-힣 ]/g,' ').replace(/s+/g,' ').trim();
const docs=E.map((e,i)=>{const n=norm(e[1]),t=n.split(' ');return {i,n,t:new Set(t),p:t.join('')}});
let selected=-1,filtered=E.map((_,i)=>i),cols=8,rowH=119,timer;
const q=document.querySelector('#q'),viewport=document.querySelector('#viewport'),grid=document.querySelector('#grid'),spacer=document.querySelector('#spacer'),count=document.querySelector('#count'),heading=document.querySelector('#heading'),toast=document.querySelector('#toast');
const catCounts=G.map((_,g)=>E.reduce((n,e)=>n+(e[2]===g),0));
function cats(){document.querySelector('#cats').innerHTML='<h2>Categories</h2>'+['전체',...G].map((g,i)=>{let id=i-1;return '<button class="cat '+(selected===id?'active':'')+'" data-g="'+id+'"><span>'+(id<0?'전체':(GN[id]||g))+'</span><small>'+(id<0?E.length:catCounts[id])+'</small></button>'}).join('')}
function search(){let raw=norm(q.value),terms=raw.split(' ').filter(Boolean).map(x=>norm(KO[x]||x).split(' ')),base=E.map((_,i)=>i);if(selected>=0)base=base.filter(i=>E[i][2]===selected);if(terms.length){let scored=[];for(const i of base){let d=docs[i],s=0,ok=true;for(const alts of terms){let best=0;for(const t of alts){let v=d.n===t?120:d.t.has(t)?70:d.n.startsWith(t)?48:d.n.includes(t)?30:d.p.includes(t)?12:0;if(v>best)best=v}if(!best){ok=false;break}s+=best}if(ok)scored.push([i,s-E[i][1].length*.01])}scored.sort((a,b)=>b[1]-a[1]);filtered=scored.map(x=>x[0])}else filtered=base;heading.textContent=raw?'“'+q.value.trim()+'” 검색 결과':selected<0?'모든 이모지':(GN[selected]||G[selected]);count.textContent=filtered.length.toLocaleString()+'개';viewport.scrollTop=0;layout();render()}
function layout(){cols=Math.max(3,Math.floor(viewport.clientWidth/118));rowH=innerWidth<760?106:119;grid.style.setProperty('--cols',cols);spacer.style.height=Math.ceil(filtered.length/cols)*rowH+'px'}
